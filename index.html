<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Akreditasi RS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel CDN for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-in-down { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade-in { animation: fade-in 0.2s ease-out; }
    .animate-fade-in-down { animation: fade-in-down 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-zoom-in { animation: zoom-in 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 1. SILAKAN ISI KONFIGURASI FIREBASE ANDA DI SINI
    // =========================================================================
    const myFirebaseConfig = {
      apiKey: "AIzaSyBx1X7bxbv3u1Moz4HDkTgF1hWKyCtKQOs",
      authDomain: "scheduler-23fa5.firebaseapp.com",
      projectId: "scheduler-23fa5",
      storageBucket: "scheduler-23fa5.firebasestorage.app",
      messagingSenderId: "996236616914",
      appId: "1:996236616914:web:353f1d818b34b839c6f90b"
    };

    // Perbaikan: Hanya inisialisasi Firebase JIKA API Key sudah diganti
    const isConfigured = myFirebaseConfig.apiKey !== "API_KEY_ANDA" && myFirebaseConfig.apiKey.trim() !== "";
    
    let app = null;
    let auth = null;
    let db = null;

    if (isConfigured) {
      app = initializeApp(myFirebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    const CalendarIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
    );

    const UsersIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    );

    const TrashIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    );

    const ClockIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );

    const SparklesIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );

    const ListIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    );

    const CalendarGridIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="3" y1="14" x2="21" y2="14"/></svg>
    );

    const INITIAL_TEAMS = [
      "TKRS", "KPS", "PMKP", "PPI", "MFK", "APK", "PP", "PAP", "SKP", "KE", 
      "MRMIK", "PKPO", "PAB", "HPK", "PROGNAS 1", "PROGNAS 2", "PROGNAS 3", 
      "PROGNAS 4", "PROGNAS 5", "PROGNAS 6"
    ];

    const TEAM_COLORS = [
      { bg: 'bg-rose-100', text: 'text-rose-800', border: 'border-rose-300', dot: 'bg-rose-500' },
      { bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-300', dot: 'bg-indigo-500' },
      { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-300', dot: 'bg-emerald-500' },
      { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', dot: 'bg-amber-500' },
      { bg: 'bg-sky-100', text: 'text-sky-800', border: 'border-sky-300', dot: 'bg-sky-500' },
      { bg: 'bg-violet-100', text: 'text-violet-800', border: 'border-violet-300', dot: 'bg-violet-500' },
      { bg: 'bg-fuchsia-100', text: 'text-fuchsia-800', border: 'border-fuchsia-300', dot: 'bg-fuchsia-500' },
      { bg: 'bg-lime-100', text: 'text-lime-800', border: 'border-lime-300', dot: 'bg-lime-500' },
      { bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-300', dot: 'bg-orange-500' },
      { bg: 'bg-cyan-100', text: 'text-cyan-800', border: 'border-cyan-300', dot: 'bg-cyan-500' },
    ];

    const getTeamColor = (teamName) => {
      if (!teamName) return TEAM_COLORS[0];
      let hash = 0;
      for (let i = 0; i < teamName.length; i++) {
        hash = teamName.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % TEAM_COLORS.length;
      return TEAM_COLORS[index];
    };

    const getTodayString = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const formatDateIndo = (dateStr) => {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    };

    function App() {
      const [user, setUser] = useState(null);
      const [currentView, setCurrentView] = useState('staff'); 
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      
      const [teams, setTeams] = useState(() => {
        const saved = localStorage.getItem('localTeams');
        return saved ? JSON.parse(saved) : INITIAL_TEAMS;
      });
      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('localSchedules');
        return saved ? JSON.parse(saved) : [];
      });
      
      const [notification, setNotification] = useState(null);
      const [firebaseError, setFirebaseError] = useState(false);

      const showNotification = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      useEffect(() => {
        let unsubSchedules = () => {};
        let unsubTeams = () => {};
        let isListenersSetup = false;

        const setupListeners = () => {
          if (isListenersSetup) return;
          isListenersSetup = true;

          if (!isConfigured) {
            setFirebaseError(true);
            return;
          }

          const schedulesRef = collection(db, 'schedules');
          unsubSchedules = onSnapshot(schedulesRef, (snapshot) => {
            const fetchedSchedules = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setSchedules(fetchedSchedules);
            localStorage.setItem('localSchedules', JSON.stringify(fetchedSchedules));
            setFirebaseError(false);
          }, (err) => {
            console.warn("Mode Lokal Aktif - Gagal membaca jadwal Firebase:", err.message);
            if(err.code === 'permission-denied') setFirebaseError(true);
          });

          const teamsDocRef = doc(db, 'settings', 'teamsList');
          unsubTeams = onSnapshot(teamsDocRef, (docSnap) => {
            if (docSnap.exists()) {
              setTeams(docSnap.data().list || []);
              localStorage.setItem('localTeams', JSON.stringify(docSnap.data().list || []));
            } else {
              setDoc(teamsDocRef, { list: INITIAL_TEAMS }).catch(() => {});
              setTeams(INITIAL_TEAMS);
            }
            setFirebaseError(false);
          }, (err) => {
            console.warn("Mode Lokal Aktif - Gagal membaca tim Firebase:", err.message);
            if(err.code === 'permission-denied') setFirebaseError(true);
          });
        };

        if (isConfigured) {
          const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
            setUser(currentUser);
            setupListeners();
          });

          signInAnonymously(auth).catch((err) => {
            console.warn("Auth anonim gagal, mencoba membaca tanpa auth...", err);
            setupListeners();
          });

          return () => {
            unsubscribeAuth();
            unsubSchedules();
            unsubTeams();
          };
        } else {
          setupListeners();
        }
      }, []);

      const handleAdminLogin = (pin) => {
        if (pin === '192026') {
          setIsAdminAuth(true);
          showNotification('Login Admin Berhasil');
        } else {
          showNotification('PIN Salah!', 'error');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-12">
          <header className="bg-teal-800 text-white shadow-lg sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-4 flex justify-between items-center">
              <div>
                <h1 className="text-lg md:text-2xl font-bold flex items-center gap-2">
                  <CalendarIcon />
                  Jadwal Akreditasi RS
                </h1>
                <p className="text-teal-200 text-xs md:text-sm mt-1">Portal Pemantauan Tim Pokja</p>
              </div>
              
              <div>
                {currentView === 'staff' ? (
                  <button 
                    onClick={() => setCurrentView('admin')}
                    className="bg-teal-600 hover:bg-teal-500 text-white px-3 md:px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-sm"
                  >
                    Login Admin
                  </button>
                ) : (
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setCurrentView('staff')}
                      className="bg-teal-900 hover:bg-slate-900 text-white px-3 md:px-4 py-2 rounded-lg text-sm font-bold transition-colors"
                    >
                      <span className="hidden md:inline">Lihat Jadwal Publik</span>
                      <span className="md:hidden">Publik</span>
                    </button>
                    {isAdminAuth && (
                      <button 
                        onClick={() => { setIsAdminAuth(false); setCurrentView('staff'); }}
                        className="bg-rose-600 hover:bg-rose-500 text-white px-3 md:px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-sm"
                      >
                        Keluar
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          </header>

          {firebaseError && (
            <div className="bg-rose-500 text-white text-center py-2 px-4 text-xs md:text-sm font-medium flex items-center justify-center gap-2 shadow-inner">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              Mode Lokal Aktif. Database Firebase belum terhubung atau diblokir.
            </div>
          )}

          {notification && (
            <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 animate-fade-in-down transition-all w-11/12 max-w-md">
              <div className={`${notification.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'} text-white px-5 py-3 rounded-xl shadow-2xl font-medium flex items-center justify-center gap-3 border border-white/20 backdrop-blur-sm`}>
                {notification.message}
              </div>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8">
            {currentView === 'staff' && (
              <StaffView schedules={schedules} teams={teams} />
            )}
            {currentView === 'admin' && !isAdminAuth && (
              <LoginView onLogin={handleAdminLogin} onCancel={() => setCurrentView('staff')} />
            )}
            {currentView === 'admin' && isAdminAuth && (
              <AdminDashboard 
                teams={teams} setTeams={setTeams}
                schedules={schedules} setSchedules={setSchedules}
                showNotification={showNotification}
                isConfigured={isConfigured} db={db}
              />
            )}
          </main>
        </div>
      );
    }

    function StaffView({ schedules, teams }) {
      const [viewMode, setViewMode] = useState('list'); // 'list' or 'calendar'
      const [filterTeam, setFilterTeam] = useState('ALL');

      const todayString = getTodayString();
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today.getMonth());
      const [currentYear, setCurrentYear] = useState(today.getFullYear());

      // Filter schedules based on selected team
      const filteredSchedules = useMemo(() => {
        if (filterTeam === 'ALL') return schedules;
        return schedules.filter(sch => sch.team === filterTeam);
      }, [schedules, filterTeam]);

      const { todaySchedules, upcomingSchedules } = useMemo(() => {
        const todayArr = [];
        const upcomingArr = [];
        filteredSchedules.forEach(sch => {
          if (sch.date === todayString) todayArr.push(sch);
          else if (sch.date > todayString) upcomingArr.push(sch);
        });

        todayArr.sort((a, b) => a.startTime.localeCompare(b.startTime));
        upcomingArr.sort((a, b) => {
          if (a.date !== b.date) return a.date.localeCompare(b.date);
          return a.startTime.localeCompare(b.startTime);
        });
        return { todaySchedules: todayArr, upcomingSchedules: upcomingArr };
      }, [filteredSchedules, todayString]);

      const groupedUpcoming = useMemo(() => {
        const grouped = {};
        upcomingSchedules.forEach(sch => {
          if (!grouped[sch.date]) grouped[sch.date] = [];
          grouped[sch.date].push(sch);
        });
        return grouped;
      }, [upcomingSchedules]);

      // Calendar Logic for Staff View
      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      
      const generateDays = () => {
        const days = [];
        const firstDayDate = new Date(currentYear, currentMonth, 1);
        const firstDay = firstDayDate.getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1; 

        const prevMonthLastDate = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = startOffset - 1; i >= 0; i--) {
          days.push({ date: new Date(currentYear, currentMonth - 1, prevMonthLastDate - i), isCurrentMonth: false });
        }
        
        const currentMonthLastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let i = 1; i <= currentMonthLastDate; i++) {
          days.push({ date: new Date(currentYear, currentMonth, i), isCurrentMonth: true });
        }

        const remaining = 42 - days.length;
        for (let i = 1; i <= remaining; i++) {
          days.push({ date: new Date(currentYear, currentMonth + 1, i), isCurrentMonth: false });
        }

        return days.map(d => {
          const y = d.date.getFullYear();
          const m = String(d.date.getMonth() + 1).padStart(2, '0');
          const day = String(d.date.getDate()).padStart(2, '0');
          return { ...d, dateString: `${y}-${m}-${day}`, dayNum: d.date.getDate() };
        });
      };

      const nextMonth = () => { if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(currentYear + 1); } else setCurrentMonth(currentMonth + 1); };
      const prevMonth = () => { if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(currentYear - 1); } else setCurrentMonth(currentMonth - 1); };
      const calendarDays = generateDays();

      return (
        <div className="space-y-6 md:space-y-8">
          
          {/* Controls: Filter & View Toggle */}
          <div className="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200 w-full md:w-auto">
              <button 
                onClick={() => setViewMode('list')} 
                className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${viewMode === 'list' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-700'}`}
              >
                <ListIcon/> Tampilan Daftar
              </button>
              <button 
                onClick={() => setViewMode('calendar')} 
                className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${viewMode === 'calendar' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-700'}`}
              >
                <CalendarGridIcon/> Kalender
              </button>
            </div>
            
            <div className="w-full md:w-64 flex items-center gap-3">
              <label className="text-sm font-bold text-slate-500 hidden md:block">Filter:</label>
              <select 
                value={filterTeam} 
                onChange={(e) => setFilterTeam(e.target.value)} 
                className="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none font-bold bg-slate-50 text-slate-700 shadow-sm"
              >
                <option value="ALL">Semua Pokja</option>
                {teams.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          </div>

          {/* Today's Schedule Banner */}
          <section className="bg-gradient-to-br from-teal-700 to-emerald-900 rounded-3xl p-6 md:p-10 text-white shadow-xl relative overflow-hidden">
            <div className="absolute -top-32 -right-32 w-80 h-80 bg-white opacity-10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-24 -left-24 w-64 h-64 bg-teal-300 opacity-10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div className="relative z-10">
              <div className="flex items-center gap-3 mb-2">
                <SparklesIcon />
                <h2 className="text-2xl md:text-3xl font-bold tracking-tight">Jadwal Hari Ini</h2>
              </div>
              <p className="text-teal-100 mb-6 font-medium text-base md:text-lg border-b border-teal-500/30 pb-4 inline-block">{formatDateIndo(todayString)}</p>

              {todaySchedules.length === 0 ? (
                <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 text-center max-w-2xl mx-auto shadow-inner">
                  <p className="text-lg font-medium text-teal-50">
                    {filterTeam === 'ALL' ? "Tidak ada agenda pertemuan akreditasi hari ini." : `Tidak ada agenda pertemuan untuk tim ${filterTeam} hari ini.`}
                  </p>
                  <p className="text-teal-200/80 mt-2 text-sm">Selamat bertugas dan berikan pelayanan terbaik!</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
                  {todaySchedules.map(sch => {
                    const color = getTeamColor(sch.team);
                    return (
                      <div key={sch.id} className="bg-white text-slate-800 rounded-2xl p-5 shadow-xl transform transition-transform hover:-translate-y-1 relative overflow-hidden border border-slate-100">
                        <div className={`absolute top-0 left-0 right-0 h-1.5 ${color.dot}`}></div>
                        <div className="flex justify-between items-start mb-3 mt-1">
                          <h3 className={`text-2xl font-extrabold ${color.text}`}>{sch.team}</h3>
                          <span className={`${color.bg} ${color.text} text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm`}>
                            <ClockIcon /> {sch.startTime} - {sch.endTime}
                          </span>
                        </div>
                        <p className="text-sm text-slate-500 flex items-center gap-2 font-medium mt-4">
                          <span className={`w-2.5 h-2.5 rounded-full ${color.dot} animate-pulse shadow-[0_0_8px_currentColor]`}></span>
                          Sedang / Akan Berlangsung
                        </p>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          {/* Conditional Layout: List vs Calendar */}
          {viewMode === 'list' ? (
            <section>
              <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                <ListIcon /> Agenda Pertemuan Mendatang
              </h2>
              
              {Object.keys(groupedUpcoming).length === 0 ? (
                <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-slate-200 text-center">
                  <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                    <CalendarIcon />
                  </div>

                  <h2 className="text-lg lg:text-2xl font-extrabold text-slate-800 w-40 lg:w-56 text-center leading-tight">
                    {monthNames[currentMonth]} {currentYear}

                  <button onClick={nextMonth} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                  </button>
                </div>
                <button 
                  onClick={() => {setCurrentMonth(today.getMonth()); setCurrentYear(today.getFullYear())}}
                  className="px-3 py-1.5 lg:px-4 lg:py-2 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors text-xs lg:text-sm"
                >
                  Hari Ini
                </button>
              </div>

              <div className="overflow-auto p-4 custom-scrollbar bg-slate-50">
                <div className="min-w-[700px] grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                  {['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((d, i) => (
                    <div key={d} className={`bg-slate-100 py-3 text-center text-sm font-extrabold ${i === 6 ? 'text-rose-500' : 'text-slate-600'}`}>
                      {d}
                    </div>
                  ))}
                  
                  {calendarDays.map((dayObj, i) => {
                    const isToday = dayObj.dateString === getTodayString();
                    const isSunday = dayObj.date.getDay() === 0;
                    const daySchedules = filteredSchedules.filter(s => s.date === dayObj.dateString).sort((a,b) => a.startTime.localeCompare(b.startTime));

                    return (
                      <div 
                        key={i} 
                        className={`min-h-[110px] lg:min-h-[130px] p-2 transition-colors relative ${!dayObj.isCurrentMonth ? 'bg-slate-50/50 text-slate-400' : isSunday ? 'bg-rose-50/20' : 'bg-white'} ${isToday ? 'ring-2 ring-inset ring-teal-500 bg-teal-50/10' : ''}`}
                      >
                        <div className={`text-right text-xs lg:text-sm font-bold mb-2 ${isToday ? 'text-teal-600' : isSunday ? 'text-rose-400' : 'text-slate-600'}`}>
                          <span className={isToday ? 'bg-teal-500 text-white w-6 h-6 lg:w-7 lg:h-7 inline-flex items-center justify-center rounded-full shadow-md' : ''}>
                            {dayObj.dayNum}
                          </span>
                        </div>
                        
                        <div className="space-y-1.5 pb-2">
                          {daySchedules.map(sch => {
                            const color = getTeamColor(sch.team);
                            return (
                              <div key={sch.id} className={`text-[10px] lg:text-xs ${color.bg} ${color.text} border ${color.border} rounded-md px-2 py-1.5 shadow-sm`}>
                                <div className="font-extrabold truncate">{sch.team}</div>
                                <div className="font-medium opacity-80 mt-0.5">{sch.startTime} - {sch.endTime}</div>
                              </div>
                            )
                          })}

                      </div>
                    )
                  })}
                </div>
              </div>
            </section>
          )}
        </div>
      );
    }

              <button type="submit" className="w-full py-3.5 px-2 md:px-4 bg-teal-600 hover:bg-teal-700 text-white shadow-lg shadow-teal-600/30 rounded-xl font-bold transition-all hover:-translate-y-0.5">Masuk</button>

    }

    function AdminDashboard({ teams, setTeams, schedules, setSchedules, showNotification, isConfigured, db }) {
      const [activeTab, setActiveTab] = useState('schedules');

      return (
        <div className="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden flex flex-col min-h-[85vh]">
          <div className="flex border-b border-slate-200 bg-slate-50/80 backdrop-blur-sm shrink-0 flex-wrap">
            <button 
              className={`flex-1 py-4 md:py-5 px-2 md:px-6 text-sm md:text-base font-bold flex items-center justify-center gap-1 md:gap-2 transition-all ${activeTab === 'schedules' ? 'bg-white text-teal-700 border-b-2 border-teal-600 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'}`}
              onClick={() => setActiveTab('schedules')}
            >
              <CalendarIcon /> <span className="hidden sm:inline">Kelola Jadwal</span><span className="sm:hidden">Jadwal</span>
            </button>
            <button 
              className={`flex-1 py-4 md:py-5 px-2 md:px-6 text-sm md:text-base font-bold flex items-center justify-center gap-1 md:gap-2 transition-all ${activeTab === 'teams' ? 'bg-white text-teal-700 border-b-2 border-teal-600 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)]' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'}`}
              onClick={() => setActiveTab('teams')}
            >
              <UsersIcon /> <span className="hidden sm:inline">Daftar Tim Pokja</span><span className="sm:hidden">Pokja</span>
            </button>
          </div>

          <div className="p-0 overflow-y-auto flex-1 flex flex-col bg-slate-50/50">
            {activeTab === 'schedules' ? (
              <ScheduleManager teams={teams} schedules={schedules} setSchedules={setSchedules} showNotification={showNotification} isConfigured={isConfigured} db={db} />
            ) : (
              <div className="p-5 md:p-8">
                <TeamManager teams={teams} setTeams={setTeams} schedules={schedules} showNotification={showNotification} isConfigured={isConfigured} db={db} />
              </div>
            )}
          </div>
        </div>
      );
    }

    function ScheduleManager({ teams, schedules, setSchedules, showNotification, isConfigured, db }) {
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today.getMonth());
      const [currentYear, setCurrentYear] = useState(today.getFullYear());
      
      const [filterTeam, setFilterTeam] = useState('ALL');

      const [modalOpen, setModalOpen] = useState(false);
      const [scheduleToDelete, setScheduleToDelete] = useState(null);
      const [draftSchedule, setDraftSchedule] = useState({
        team: '', date: '', startTime: '08:00', endTime: '09:00'
      });

      const validateTime = (start, end, date) => {
        if (!date) return "Tanggal tidak valid";
        const [startH, startM] = start.split(':').map(Number);
        const [endH, endM] = end.split(':').map(Number);
        
        const startMinutes = startH * 60 + startM;
        const endMinutes = endH * 60 + endM;
        const durationMinutes = endMinutes - startMinutes;

        if (startMinutes < 8 * 60) return "Pertemuan mulai minimal 08:00";
        if (endMinutes > 16 * 60) return "Pertemuan maksimal selesai 16:00";
        if (durationMinutes < 60) return "Durasi pertemuan minimal 1 jam";
        if (durationMinutes > 120) return "Durasi pertemuan maksimal 2 jam";
        return null; 
      };

      const handleDragStart = (e, team) => { e.dataTransfer.setData('text/plain', team); };
      const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('bg-teal-50'); };
      const handleDragLeave = (e) => { e.currentTarget.classList.remove('bg-teal-50'); };
      
      const handleDrop = (e, dateStr) => {
        e.preventDefault();
        e.currentTarget.classList.remove('bg-teal-50');
        
        const d = new Date(dateStr);
        if (d.getDay() === 0) {
          showNotification("Hari Minggu tidak bisa dijadwalkan", "error");
          return;
        }

        const teamName = e.dataTransfer.getData('text/plain');
        if (!teamName) return;

        setDraftSchedule({ team: teamName, date: dateStr, startTime: '08:00', endTime: '09:00' });
        setModalOpen(true);
      };

      const handleDayClick = (dateStr) => {
        const d = new Date(dateStr);
        if (d.getDay() === 0) {
          showNotification("Hari Minggu tidak bisa dijadwalkan", "error");
          return;
        }
        setDraftSchedule({ team: '', date: dateStr, startTime: '08:00', endTime: '09:00' });
        setModalOpen(true);
      };

      const saveSchedule = async (e) => {
        e.preventDefault();
        if (!draftSchedule.team) {
          showNotification("Harap pilih Tim Pokja", "error"); return;
        }

        const validationError = validateTime(draftSchedule.startTime, draftSchedule.endTime, draftSchedule.date);
        if (validationError) { showNotification(validationError, "error"); return; }

        const isOverlapping = schedules.some(sch => {
          if (sch.team !== draftSchedule.team || sch.date !== draftSchedule.date) return false;
          return (draftSchedule.startTime < sch.endTime && draftSchedule.endTime > draftSchedule.startTime);
        });

        if (isOverlapping) {
          showNotification(`Tim ${draftSchedule.team} sudah ada jadwal bentrok di jam tersebut.`, "error");
          return;
        }

        const newSchedule = { ...draftSchedule, createdAt: new Date().toISOString() };

        if (isConfigured) {
          try {
            const ref = collection(db, 'schedules');
            await addDoc(ref, newSchedule);
            showNotification("Jadwal tersimpan di Cloud!");
          } catch (err) {
            saveToLocalStorage(newSchedule);
          }
        } else {
          saveToLocalStorage(newSchedule);
        }
        setModalOpen(false);
      };

      const saveToLocalStorage = (newSchedule) => {
        const localSch = { id: Date.now().toString(), ...newSchedule };
        setSchedules(prev => {
          const updated = [...prev, localSch];
          localStorage.setItem('localSchedules', JSON.stringify(updated));
          return updated;
        });
        showNotification("Tersimpan secara Lokal");
      };

      const handleDelete = (e, id) => {
        e.stopPropagation();
        setScheduleToDelete(id);
      };

      const executeDelete = async () => {
        if (!scheduleToDelete) return;
        const id = scheduleToDelete;
        setScheduleToDelete(null);

        if (isConfigured) {
          try {
            const docRef = doc(db, 'schedules', id);
            await deleteDoc(docRef);
            showNotification("Jadwal berhasil dihapus dari Cloud");
          } catch (err) {
            deleteFromLocalStorage(id);
          }
        } else {
          deleteFromLocalStorage(id);
        }
      };

      const deleteFromLocalStorage = (id) => {
        setSchedules(prev => {
          const updated = prev.filter(sch => sch.id !== id);
          localStorage.setItem('localSchedules', JSON.stringify(updated));
          return updated;
        });
        showNotification("Jadwal dihapus (Mode Lokal)");
      };

      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      
      const generateDays = () => {
        const days = [];
        const firstDayDate = new Date(currentYear, currentMonth, 1);
        const firstDay = firstDayDate.getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1; 

        const prevMonthLastDate = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = startOffset - 1; i >= 0; i--) {
          days.push({ date: new Date(currentYear, currentMonth - 1, prevMonthLastDate - i), isCurrentMonth: false });
        }
        
        const currentMonthLastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let i = 1; i <= currentMonthLastDate; i++) {
          days.push({ date: new Date(currentYear, currentMonth, i), isCurrentMonth: true });
        }

        const remaining = 42 - days.length;
        for (let i = 1; i <= remaining; i++) {
          days.push({ date: new Date(currentYear, currentMonth + 1, i), isCurrentMonth: false });
        }

        return days.map(d => {
          const y = d.date.getFullYear();
          const m = String(d.date.getMonth() + 1).padStart(2, '0');
          const day = String(d.date.getDate()).padStart(2, '0');
          return { ...d, dateString: `${y}-${m}-${day}`, dayNum: d.date.getDate() };
        });
      };

      const nextMonth = () => { if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(currentYear + 1); } else setCurrentMonth(currentMonth + 1); };
      const prevMonth = () => { if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(currentYear - 1); } else setCurrentMonth(currentMonth - 1); };

      const calendarDays = generateDays();

      return (
        <div className="flex flex-col lg:flex-row flex-1 overflow-hidden h-full">
          <div className="lg:w-72 bg-white border-b lg:border-r border-slate-200 p-4 lg:p-6 flex flex-col shrink-0 z-10 shadow-[2px_0_10px_rgba(0,0,0,0.03)] h-64 lg:h-auto">
            <h3 className="font-bold text-lg mb-2 text-slate-800 flex items-center gap-2">
              <SparklesIcon /> Daftar Pokja
            </h3>
            <p className="text-xs text-slate-500 mb-4 font-medium bg-slate-50 p-3 border border-slate-200 rounded-xl shadow-sm">
              💡 <span className="hidden lg:inline">Seret (drag) kotak tim ke tanggal kalender untuk membuat jadwal.</span>
              <span className="lg:hidden">Ketuk (tap) kotak tanggal di kalender bawah untuk menambah jadwal baru.</span>
            </p>
            
            <div className="overflow-y-auto flex-1 pr-2 space-y-2 lg:space-y-3 custom-scrollbar">
              {teams.length === 0 && <p className="text-sm text-slate-400">Belum ada tim terdaftar.</p>}
              {teams.map(team => {
                const color = getTeamColor(team);
                return (
                  <div
                    key={team}
                    draggable
                    onDragStart={(e) => handleDragStart(e, team)}
                    className={`${color.bg} ${color.text} ${color.border} border-2 px-3 py-2.5 lg:px-4 lg:py-3 rounded-xl font-bold cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md transition-all hover:-translate-y-0.5 flex items-center gap-2 lg:gap-3 text-sm lg:text-base`}
                  >
                    <div className={`w-2.5 h-2.5 lg:w-3 lg:h-3 rounded-full ${color.dot}`}></div>
                    {team}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="flex-1 flex flex-col bg-white overflow-hidden">
            <div className="p-4 lg:p-6 flex flex-col sm:flex-row items-center justify-between border-b border-slate-100 shrink-0 bg-white gap-4">
              
              <div className="flex items-center gap-2 lg:gap-4">
                <button onClick={prevMonth} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <h2 className="text-lg lg:text-2xl font-extrabold text-slate-800 w-40 lg:w-56 text-center leading-tight">
                  {monthNames[currentMonth]} {currentYear}
                </h2>
                <button onClick={nextMonth} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 transition-colors">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <select 
                  value={filterTeam} 
                  onChange={(e) => setFilterTeam(e.target.value)}
                  className="flex-1 sm:flex-none px-3 py-2 lg:px-4 rounded-lg border-2 border-slate-200 font-bold text-slate-700 bg-slate-50 outline-none focus:border-teal-500 text-sm"
                >
                  <option value="ALL">Semua Pokja</option>
                  {teams.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
                <button 
                  onClick={() => {setCurrentMonth(today.getMonth()); setCurrentYear(today.getFullYear())}}
                  className="px-3 py-2 lg:px-4 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors text-sm shrink-0"
                >
                  Hari Ini
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-auto p-4 custom-scrollbar bg-slate-50 lg:bg-white">
              <div className="min-w-[700px] grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-2xl overflow-hidden shrink-0 shadow-sm">
                {['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((d, i) => (
                  <div key={d} className={`bg-slate-100 py-3 text-center text-sm font-extrabold ${i === 6 ? 'text-rose-500' : 'text-slate-600'}`}>
                    {d}
                  </div>
                ))}
                
                {calendarDays.map((dayObj, i) => {
                  const isToday = dayObj.dateString === getTodayString();
                  const isSunday = dayObj.date.getDay() === 0;
                  // Terapkan filter di dalam sel kalender
                  const daySchedules = schedules.filter(s => s.date === dayObj.dateString && (filterTeam === 'ALL' || s.team === filterTeam)).sort((a,b) => a.startTime.localeCompare(b.startTime));

                  return (
                    <div 
                      key={i} 
                      onClick={() => handleDayClick(dayObj.dateString)}
                      onDragOver={handleDragOver}
                      onDragLeave={handleDragLeave}
                      onDrop={(e) => handleDrop(e, dayObj.dateString)}
                      className={`min-h-[110px] lg:min-h-[130px] p-2 transition-colors relative group/day cursor-pointer lg:cursor-default ${!dayObj.isCurrentMonth ? 'bg-slate-50/50 text-slate-400' : isSunday ? 'bg-rose-50/20' : 'bg-white'} hover:bg-teal-50/30 ${isToday ? 'ring-2 ring-inset ring-teal-500 bg-teal-50/10' : ''}`}
                    >
                      <div className={`text-right text-xs lg:text-sm font-bold mb-2 ${isToday ? 'text-teal-600' : isSunday ? 'text-rose-400' : 'text-slate-600'}`}>
                        <span className={isToday ? 'bg-teal-500 text-white w-6 h-6 lg:w-7 lg:h-7 inline-flex items-center justify-center rounded-full shadow-md' : ''}>
                          {dayObj.dayNum}
                        </span>
                      </div>
                      
                      {!isSunday && (
                        <div className="absolute top-2 left-2 opacity-0 group-hover/day:opacity-100 text-teal-500 text-xs font-bold pointer-events-none transition-opacity hidden lg:block">
                          + Tambah
                        </div>
                      )}

                      <div className="space-y-1.5 pb-2">
                        {daySchedules.map(sch => {
                          const color = getTeamColor(sch.team);
                          return (
                            <div 
                              key={sch.id} 
                              onClick={(e) => e.stopPropagation()} 
                              className={`group/item text-[10px] lg:text-xs relative ${color.bg} ${color.text} border ${color.border} rounded-md px-2 py-1.5 shadow-sm hover:shadow-md transition-shadow`}
                            >
                              <div className="font-extrabold truncate pr-6">{sch.team}</div>
                              <div className="font-medium opacity-80 mt-0.5">{sch.startTime} - {sch.endTime}</div>
                              
                              <button 
                                onClick={(e) => handleDelete(e, sch.id)}
                                className="absolute right-1 top-1 p-1 lg:p-1.5 bg-white/80 rounded-md text-rose-500 lg:opacity-0 group-hover/item:opacity-100 hover:bg-rose-500 hover:text-white transition-all z-20 shadow-sm border border-transparent hover:border-rose-600 flex items-center justify-center"
                                title="Hapus Jadwal"
                              >
                                <TrashIcon />
                              </button>
                            </div>
                          )
                        })}
                      </div>
                    </div>
                  )
                })}
              </div>
            </div>
          </div>

          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform scale-100 animate-zoom-in">
                <div className={`p-5 lg:p-6 border-b ${draftSchedule.team ? getTeamColor(draftSchedule.team).bg : 'bg-slate-100'} ${draftSchedule.team ? getTeamColor(draftSchedule.team).text : 'text-slate-700'}`}>
                  <h3 className="font-bold text-lg lg:text-xl flex items-center gap-2">
                    <CalendarIcon /> Atur Waktu Pertemuan
                  </h3>
                </div>
                
                <form onSubmit={saveSchedule} className="p-5 lg:p-6 space-y-5">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center relative">
                    <p className="text-xs lg:text-sm text-slate-500 mb-1">Tim Pokja</p>
                    
                    {draftSchedule.team ? (
                      <p className="text-xl lg:text-2xl font-extrabold text-slate-800 uppercase">{draftSchedule.team}</p>
                    ) : (
                      <select 
                        required 
                        value={draftSchedule.team} 
                        onChange={(e) => setDraftSchedule({...draftSchedule, team: e.target.value})}
                        className="w-full mt-1 px-3 py-2.5 rounded-lg border-2 border-teal-500 focus:ring-2 focus:ring-teal-500 outline-none font-bold text-slate-700 text-center uppercase shadow-sm bg-white"
                      >
                        <option value="" disabled>-- Pilih Tim --</option>
                        {teams.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    )}
                    
                    <div className="h-px bg-slate-200 my-4"></div>
                    <p className="text-xs lg:text-sm text-slate-500 mb-1">Tanggal</p>
                    <p className="text-base lg:text-lg font-bold text-teal-700">{formatDateIndo(draftSchedule.date)}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs lg:text-sm font-bold text-slate-700 mb-2">Mulai (08:00)</label>
                      <input 
                        type="time" min="08:00" max="15:00" required
                        value={draftSchedule.startTime} onChange={(e) => setDraftSchedule({...draftSchedule, startTime: e.target.value})}
                        className="w-full px-3 py-2.5 lg:px-4 lg:py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none font-bold bg-white text-center"
                      />
                    </div>
                    <div>
                      <label className="block text-xs lg:text-sm font-bold text-slate-700 mb-2">Selesai (16:00)</label>
                      <input 
                        type="time" min="09:00" max="16:00" required
                        value={draftSchedule.endTime} onChange={(e) => setDraftSchedule({...draftSchedule, endTime: e.target.value})}
                        className="w-full px-3 py-2.5 lg:px-4 lg:py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none font-bold bg-white text-center"
                      />
                    </div>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onClick={() => setModalOpen(false)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors text-sm lg:text-base">
                      Batal
                    </button>
                    <button type="submit" className="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-lg shadow-teal-600/30 transition-all text-sm lg:text-base">
                      Simpan Jadwal
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {scheduleToDelete && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center transform scale-100 animate-zoom-in">
                <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </div>
                <h3 className="font-bold text-xl text-slate-800 mb-2">Hapus Jadwal?</h3>
                <p className="text-slate-500 text-sm mb-6">Jadwal pertemuan ini akan dihapus secara permanen dari kalender.</p>
                <div className="flex gap-3">
                  <button onClick={() => setScheduleToDelete(null)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">
                    Batal
                  </button>
                  <button onClick={executeDelete} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition-all">
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TeamManager({ teams, setTeams, schedules, showNotification, isConfigured, db }) {
      const [newTeam, setNewTeam] = useState('');
      const [teamToDelete, setTeamToDelete] = useState(null);

      const handleAddTeam = async (e) => {
        e.preventDefault();
        const teamName = newTeam.trim().toUpperCase();
        if (!teamName) return;
        
        if (teams.includes(teamName)) {
          showNotification("Tim sudah ada dalam daftar", "error"); return;
        }

        const updatedTeams = [...teams, teamName];
        if (isConfigured) {
          try {
            const docRef = doc(db, 'settings', 'teamsList');
            await setDoc(docRef, { list: updatedTeams });
            showNotification(`Tim ${teamName} berhasil ditambahkan ke Cloud`);
          } catch (err) {
            saveTeamToLocal(updatedTeams, teamName);
          }
        } else {
          saveTeamToLocal(updatedTeams, teamName);
        }
        setNewTeam('');
      };

      const saveTeamToLocal = (updatedTeams, teamName) => {
        setTeams(updatedTeams);
        localStorage.setItem('localTeams', JSON.stringify(updatedTeams));
        showNotification(`Tim ${teamName} ditambahkan (Mode Lokal)`);
      };

      const handleDeleteTeam = (team) => {
        const hasSchedule = schedules.some(sch => sch.team === team);
        if (hasSchedule) {
          showNotification(`Tidak bisa menghapus tim ${team} karena masih ada jadwal aktif. Hapus jadwalnya terlebih dahulu di kalender.`, "error");
          return;
        }
        setTeamToDelete(team);
      };

      const executeDeleteTeam = async () => {
        if (!teamToDelete) return;
        const team = teamToDelete;
        setTeamToDelete(null);

        const updatedTeams = teams.filter(t => t !== team);
        if (isConfigured) {
          try {
            const docRef = doc(db, 'settings', 'teamsList');
            await setDoc(docRef, { list: updatedTeams });
            showNotification(`Tim ${team} dihapus dari Cloud`);
          } catch (err) {
            deleteTeamFromLocal(updatedTeams, team);
          }
        } else {
          deleteTeamFromLocal(updatedTeams, team);
        }
      };

      const deleteTeamFromLocal = (updatedTeams, team) => {
        setTeams(updatedTeams);
        localStorage.setItem('localTeams', JSON.stringify(updatedTeams));
        showNotification(`Tim ${team} dihapus (Mode Lokal)`);
      };

      return (
        <div className="bg-white p-5 lg:p-8 rounded-2xl shadow-sm border border-slate-100">
          <div className="flex flex-col lg:flex-row gap-6 mb-8 lg:mb-10 items-start">
            <div className="flex-1">
              <h3 className="font-bold text-lg lg:text-xl mb-2 text-slate-800">Daftar Tim Pokja</h3>
              <p className="text-slate-500 text-sm leading-relaxed max-w-2xl">
                Kelola daftar tim yang akan diatur jadwalnya. Data ini tersimpan secara permanen. 
                Anda <strong className="text-rose-500">tidak dapat menghapus</strong> tim yang jadwalnya masih terpasang di kalender.
              </p>
            </div>
            
            <form onSubmit={handleAddTeam} className="w-full lg:w-96 flex gap-3">
              <input 
                type="text" 
                value={newTeam}
                onChange={(e) => setNewTeam(e.target.value)}
                placeholder="Nama Tim Baru..."
                className="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none transition-all font-bold bg-slate-50 uppercase text-sm lg:text-base"
              />
              <button type="submit" className="px-5 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow-md transition-all hover:-translate-y-0.5 text-sm lg:text-base">
                Tambah
              </button>
            </form>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 lg:gap-5">
            {teams.map(team => {
              const teamHasSchedule = schedules.some(sch => sch.team === team);
              const color = getTeamColor(team);
              return (
                <div key={team} className={`bg-white border-2 border-slate-100 rounded-xl lg:rounded-2xl p-3 lg:p-4 flex justify-between items-center group hover:border-transparent hover:shadow-lg transition-all ${color.bg} bg-opacity-10 relative overflow-hidden`}>
                  <div className="flex items-center gap-2 lg:gap-3 relative z-10">
                    <span className={`w-2.5 h-2.5 lg:w-3 lg:h-3 rounded-full ${color.dot} shadow-sm`}></span>
                    <span className={`font-extrabold text-sm lg:text-base ${color.text}`}>{team}</span>
                  </div>
                  <button 
                    onClick={() => handleDeleteTeam(team)}
                    className={`p-1.5 lg:p-2 rounded-lg transition-all relative z-10 ${teamHasSchedule ? 'text-slate-300 bg-slate-50 cursor-not-allowed' : 'text-slate-400 hover:text-white hover:bg-rose-500'}`}
                    title={teamHasSchedule ? "Hapus jadwal tim ini di kalender terlebih dahulu" : "Hapus tim"}
                    disabled={teamHasSchedule}
                  >
                    <TrashIcon />
                  </button>
                </div>
              )
            })}
          </div>

          {teamToDelete && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center transform scale-100 animate-zoom-in">
                <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                   <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </div>
                <h3 className="font-bold text-xl text-slate-800 mb-2">Hapus Pokja {teamToDelete}?</h3>
                <p className="text-slate-500 text-sm mb-6">Tim akan dihapus secara permanen dari master data. Tindakan ini tidak bisa dibatalkan.</p>
                <div className="flex gap-3">
                  <button onClick={() => setTeamToDelete(null)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">
                    Batal
                  </button>
                  <button onClick={executeDeleteTeam} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold shadow-lg shadow-rose-600/30 transition-all">
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
